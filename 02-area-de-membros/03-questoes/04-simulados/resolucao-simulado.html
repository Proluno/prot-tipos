<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resolução do Simulado</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: #181818;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── HEADER ─── */
  header.focus-header {
    background-color: #181818;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    width: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 15%;
    position: relative;
    z-index: 10;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  .focus-header-title {
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
  }

  /* ─── MAIN CONTENT ─── */
  main {
    flex: 1 1 auto;
    padding: 32px 15% 60px;
  }

  /* ─── SESSION BAR ─── */
  .session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
  }

  .question-progress {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .question-progress span {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #9a9a9f;
  }

  .progress-nav-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid #3a3a3c;
    background: none;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .progress-nav-btn svg { width: 15px; height: 15px; }

  .progress-nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .session-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pill-control {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background-color: #1e1e20;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 9px 16px;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .pill-control:hover { border-color: rgba(255, 255, 255, 0.2); }
  .pill-control svg { width: 16px; height: 16px; flex-shrink: 0; }
  .pill-control.timer { cursor: default; color: #ffffff; }
  .pill-control.timer svg { color: #E8761A; }

  .btn-finalizar {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    background-color: #E8761A;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ─── QUESTION MAP ─── */
  .map-panel {
    display: none;
    background-color: #1e1e20;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
  }

  .map-panel.open { display: block; }

  .map-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .map-title {
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
  }

  .map-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 8px;
    margin-bottom: 22px;
  }

  .map-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    aspect-ratio: 1 / 1;
    background-color: #242426;
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }

  .map-cell:hover { border-color: rgba(255, 255, 255, 0.2); }

  .map-cell .cell-header {
    font-size: 12.5px;
    font-weight: 700;
    color: #9a9a9f;
  }

  .map-cell .cell-answer {
    font-size: 11px;
    font-weight: 700;
    color: #6d6d72;
  }

  .map-cell.answered {
    border-color: rgba(34, 197, 94, 0.45);
    background-color: rgba(34, 197, 94, 0.08);
  }

  .map-cell.answered .cell-answer { color: #22C55E; }

  .map-cell.current { border-color: #E8761A; }

  .map-legend {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .legend-chip svg { width: 12px; height: 12px; }

  .legend-chip.answered { background-color: rgba(34, 197, 94, 0.15); color: #22C55E; }
  .legend-chip.nao-respondida { background-color: rgba(255, 255, 255, 0.08); color: #9a9a9f; }

  /* ─── QUESTION CARD ─── */
  .question-wrapper { position: relative; }

  .question-card {
    background-color: #1e1e20;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 28px;
    transition: filter 0.2s;
  }

  .question-wrapper.paused .question-card {
    filter: blur(9px);
    pointer-events: none;
    user-select: none;
  }

  .question-meta-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background-color: #242426;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 24px;
  }

  .question-id-badge {
    background-color: #E8761A;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 5px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .question-breadcrumb {
    font-size: 13px;
    font-weight: 600;
    color: #b6b6ba;
  }

  .question-breadcrumb .sep {
    color: #5a5a5d;
    margin: 0 6px;
    font-weight: 400;
  }

  .btn-add-aux {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    padding: 0;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: #E8761A;
    cursor: pointer;
  }

  .btn-add-aux:hover { text-decoration: underline; }
  .btn-add-aux svg { width: 15px; height: 15px; flex-shrink: 0; }

  .aux-text-field {
    margin-bottom: 18px;
    padding: 14px 16px;
    border-radius: 8px;
    background-color: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 14px;
    color: #cfcfcf;
    line-height: 1.6;
  }

  .aux-text-field.hidden { display: none; }

  .question-text {
    font-size: 15.5px;
    color: #e7e7e9;
    line-height: 1.65;
    margin-bottom: 24px;
  }

  .alternatives { display: flex; flex-direction: column; margin-bottom: 22px; }

  .alt-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 6px;
    border-radius: 8px;
    cursor: pointer;
  }

  .alt-row:hover { background-color: rgba(255, 255, 255, 0.04); }

  .alt-letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid #4a4a4d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #cfcfcf;
    flex-shrink: 0;
  }

  .alt-text { font-size: 14.5px; color: #e5e5e5; line-height: 1.5; flex: 1 1 auto; }

  .alt-scissor-slot {
    display: flex;
    align-items: center;
    gap: 4px;
    width: 34px;
    flex-shrink: 0;
  }

  .alt-scissor {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: none;
    border: none;
    color: #9a9a9f;
    cursor: pointer;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.12s;
  }

  .alt-scissor-line {
    width: 8px;
    height: 0;
    border-top: 1.5px dashed #5a5a5d;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.12s;
  }

  .alt-row:hover .alt-scissor,
  .alt-row:hover .alt-scissor-line { opacity: 1; }

  .alt-scissor:hover { background-color: rgba(255, 255, 255, 0.08); color: #ffffff; }
  .alt-scissor.active { opacity: 1; color: #E8761A; }
  .alt-row.struck .alt-scissor-line { opacity: 1; border-top-color: #E8761A; }
  .alt-scissor svg { width: 15px; height: 15px; }

  .alt-row.struck .alt-text { text-decoration: line-through; opacity: 0.55; }
  .alt-row.struck .alt-letter { opacity: 0.55; }

  .alt-row.selected .alt-letter {
    background-color: #E8761A;
    border-color: #E8761A;
    color: #ffffff;
  }

  .alt-row.locked { cursor: default; }
  .alt-row.locked:hover { background-color: transparent; }

  /* ─── PAUSE OVERLAY ─── */
  .pause-overlay {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 40;
  }

  .question-wrapper.paused .pause-overlay { display: flex; }

  .pause-overlay svg { width: 44px; height: 44px; color: #ffffff; }

  .pause-overlay h2 {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }

  .btn-continuar {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    background-color: #E8761A;
    border: none;
    border-radius: 8px;
    padding: 11px 26px;
    cursor: pointer;
  }

  /* ─── CONFIRM MODAL ─── */
  .confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.6);
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 120;
  }

  .confirm-overlay.open { display: flex; }

  .confirm-box {
    width: 100%;
    max-width: 400px;
    background-color: #1e1e20;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
  }

  .confirm-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background-color: rgba(232, 118, 26, 0.15);
    color: #E8761A;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }

  .confirm-icon svg { width: 24px; height: 24px; }

  .confirm-title {
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 10px;
  }

  .confirm-text {
    font-size: 14px;
    color: #9a9a9f;
    line-height: 1.55;
    margin-bottom: 24px;
  }

  .confirm-text strong { color: #ffffff; font-weight: 600; }

  .confirm-actions { display: flex; gap: 12px; }

  .confirm-actions button {
    flex: 1 1 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-confirm-cancel {
    background: none;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #ffffff;
  }

  .btn-confirm-cancel:hover { border-color: rgba(255, 255, 255, 0.3); }

  .btn-confirm-finalizar {
    background-color: #E8761A;
    border: none;
    color: #ffffff;
  }

  /* ─── MOBILE ─── */
  @media (max-width: 640px) {
    header.focus-header {
      padding: 14px 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .focus-header-title { font-size: 15px; }

    .btn-finalizar {
      font-size: 13px;
      padding: 9px 16px;
    }

    main { padding: 20px 16px 90px; }

    .session-bar {
      gap: 12px;
      margin-bottom: 20px;
    }

    /* Navegador de questões vira uma barra fixa no rodapé da tela */
    .question-progress {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      gap: 10px;
      width: 100%;
      justify-content: space-between;
      background-color: #1e1e20;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 20px;
      z-index: 30;
    }

    .question-progress span { font-size: 11.5px; }

    .progress-nav-btn {
      width: 34px;
      height: 34px;
    }

    .session-controls {
      gap: 8px;
      width: 100%;
    }

    .pill-control {
      padding: 8px 12px;
      font-size: 12.5px;
      gap: 6px;
      flex: 1 1 auto;
      justify-content: center;
    }

    #map-btn { flex: 1 1 auto; width: 100%; }

    .map-panel { padding: 18px; }

    .question-card { padding: 18px; }

    .question-meta-bar {
      padding: 8px 12px;
      gap: 8px;
      margin-bottom: 18px;
    }

    .question-breadcrumb { font-size: 12px; }

    .question-text {
      font-size: 14.5px;
      margin-bottom: 18px;
    }

    .alternatives { margin-bottom: 16px; }

    .alt-row {
      padding: 8px 4px;
      gap: 10px;
      align-items: flex-start;
    }

    .alt-letter {
      width: 25px;
      height: 25px;
      font-size: 12px;
      margin-top: 1px;
    }

    .alt-text { font-size: 13.5px; }

    .pause-overlay h2 { font-size: 17px; }
    .pause-overlay svg { width: 36px; height: 36px; }
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <header class="focus-header">
    <span class="focus-header-title">Simulado de Direito Constitucional</span>
    <button class="btn-finalizar" onclick="openFinalizarModal()">Finalizar simulado</button>
  </header>

  <!-- MAIN -->
  <main>
    <!-- SESSION BAR -->
    <div class="session-bar">
      <div class="question-progress">
        <button class="progress-nav-btn" id="prev-btn" onclick="prevQuestion()" title="Questão anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="progress-label">QUESTÃO 1 DE 4</span>
        <button class="progress-nav-btn" id="next-btn" onclick="nextQuestion()" title="Próxima questão">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="session-controls">
        <div class="pill-control timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span id="timer-display">00:00:00</span>
        </div>

        <button class="pill-control" id="pause-btn" onclick="togglePause()">
          <svg id="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          <span id="pause-label">Pausar</span>
        </button>

        <button class="pill-control" id="map-btn" onclick="toggleMap()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          Mapa de questões
        </button>
      </div>
    </div>

    <!-- MAPA DE QUESTÕES -->
    <div class="map-panel" id="map-panel">
      <div class="map-panel-header">
        <span class="map-title">Mapa de questões</span>
      </div>
      <div class="map-grid" id="map-grid"></div>
      <div class="map-legend">
        <span class="legend-chip answered">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Respondida
        </span>
        <span class="legend-chip nao-respondida">Não respondida</span>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="question-wrapper" id="question-wrapper">
      <div class="question-card">
        <div class="question-meta-bar">
          <span class="question-id-badge" id="question-id">ID: 501</span>
          <span class="question-breadcrumb" id="question-breadcrumb"></span>
        </div>

        <div id="aux-container"></div>

        <p class="question-text" id="question-text"></p>

        <div class="alternatives" id="alternatives"></div>
      </div>

      <!-- PAUSE OVERLAY -->
      <div class="pause-overlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <h2>Simulado pausado</h2>
        <button class="btn-continuar" onclick="togglePause()">Continuar simulado</button>
      </div>
    </div>
  </main>

  <!-- CONFIRM FINALIZAR MODAL -->
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <p class="confirm-title">Finalizar simulado?</p>
      <p class="confirm-text" id="confirm-text">Você respondeu <strong id="confirm-respondidas">0</strong> de <strong id="confirm-total">0</strong> questões. Depois de finalizar, não será possível alterar suas respostas. Deseja continuar?</p>
      <div class="confirm-actions">
        <button class="btn-confirm-cancel" onclick="closeFinalizarModal()">Cancelar</button>
        <button class="btn-confirm-finalizar" onclick="finalizarSimulado()">Sim, finalizar</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#map-btn') && !e.target.closest('#map-panel')) {
        document.getElementById('map-panel').classList.remove('open');
      }
    });

    /* ─── DADOS DO SIMULADO ─── */
    const SIMULADO_NOME = 'Simulado de Direito Constitucional';

    const TIMER_MODE = 'crescente'; // 'crescente' ou 'decrescente', conforme configurado pelo professor
    const TIMER_DURATION = 240; // usado apenas quando TIMER_MODE = 'decrescente' (em segundos)

    const TOTAL_QUESTOES = 100;

    const QUESTION_BANK = [
      {
        assunto: 'PRINCÍPIOS FUNDAMENTAIS',
        banca: 'CESPE/CEBRASPE',
        textoAuxiliar: 'Os fundamentos da República Federativa do Brasil estão previstos no art. 1º da Constituição Federal: soberania, cidadania, dignidade da pessoa humana, os valores sociais do trabalho e da livre iniciativa, e o pluralismo político.',
        text: 'A Constituição Federal de 1988 estabelece, em seu artigo 1º, os fundamentos da República Federativa do Brasil. Assinale a alternativa que apresenta corretamente um dos fundamentos constitucionais expressos nesse artigo:',
        alternatives: [
          'A separação absoluta entre os Poderes, sem qualquer mecanismo de controle recíproco.',
          'A soberania.',
          'A supremacia do interesse público sobre o individual em qualquer circunstância.',
          'A centralização administrativa como regra geral.',
          'A prevalência do Poder Executivo sobre os demais Poderes.'
        ],
        correct: 1
      },
      {
        assunto: 'DIREITOS E GARANTIAS FUNDAMENTAIS',
        banca: 'CESPE/CEBRASPE',
        textoAuxiliar: 'Os remédios constitucionais (habeas corpus, habeas data, mandado de segurança, mandado de injunção e ação popular) são instrumentos processuais destinados a proteger direitos fundamentais específicos, cada um com objeto e legitimidade próprios.',
        text: 'Sobre os direitos e garantias fundamentais previstos na Constituição Federal, assinale a alternativa correta:',
        alternatives: [
          'Os direitos fundamentais são absolutos e não admitem qualquer espécie de restrição.',
          'O habeas corpus pode ser utilizado para questionar qualquer ato administrativo, independentemente de restrição à liberdade de locomoção.',
          'O remédio constitucional cabível para proteger direito líquido e certo, não amparado por habeas corpus ou habeas data, é o mandado de segurança.',
          'As garantias fundamentais aplicam-se exclusivamente aos cidadãos brasileiros natos.',
          'O direito de petição depende do pagamento de taxas para o seu exercício.'
        ],
        correct: 2
      },
      {
        assunto: 'ORGANIZAÇÃO DO ESTADO',
        banca: 'CESPE/CEBRASPE',
        text: 'Em relação à organização político-administrativa da República Federativa do Brasil, é correto afirmar que:',
        alternatives: [

    const questions = Array.from({ length: TOTAL_QUESTOES }, (_, i) => {
      const base = QUESTION_BANK[i % QUESTION_BANK.length];
      return { ...base, id: 501 + i, materia: 'Direito Constitucional' };
    });

    const state = {
      current: 0,
      answers: {},
      struck: {},
      auxOpen: {},
      seconds: TIMER_MODE === 'decrescente' ? TIMER_DURATION : 0,
      timerId: null,
      paused: false
    };

    function letterFor(i) { return String.fromCharCode(65 + i); }

    function formatTime(s) {
      const h = Math.floor(s / 3600).toString().padStart(2, '0');
      const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${h}:${m}:${sec}`;
    }

    function renderQuestion() {
      const q = questions[state.current];
      const answer = state.answers[state.current];

      document.getElementById('progress-label').textContent = `QUESTÃO ${state.current + 1} DE ${questions.length}`;
      document.getElementById('question-id').textContent = `ID: ${q.id}`;
      document.getElementById('question-breadcrumb').innerHTML =
        `${q.materia}<span class="sep">/</span>${q.assunto}<span class="sep">/</span>${q.banca}`;
      document.getElementById('question-text').textContent = q.text;

      const auxEl = document.getElementById('aux-container');
      auxEl.innerHTML = q.textoAuxiliar ? `
        <button type="button" class="btn-add-aux" onclick="toggleAux(${state.current})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Texto auxiliar
        </button>
        <div class="aux-text-field ${state.auxOpen[state.current] ? '' : 'hidden'}">${q.textoAuxiliar}</div>
      ` : '';

      const altsEl = document.getElementById('alternatives');
      altsEl.innerHTML = q.alternatives.map((alt, i) => {
        let cls = 'alt-row';
        if (answer) {
          cls += ' locked';
          if (i === answer.selected) cls += ' selected';
        }
        const struck = isStruck(state.current, i);
        if (struck) cls += ' struck';
        return `<div class="${cls}" onclick="selectAlternative(${i})">
          <span class="alt-scissor-slot">
            <button type="button" class="alt-scissor ${struck ? 'active' : ''}" onclick="toggleStrike(event, ${state.current}, ${i})" title="${struck ? 'Desfazer risco' : 'Riscar alternativa'}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            </button>
            <span class="alt-scissor-line"></span>
          </span>
          <span class="alt-letter">${letterFor(i)}</span>
          <span class="alt-text">${alt}</span>
        </div>`;
      }).join('');

      document.getElementById('prev-btn').disabled = state.current === 0;
      document.getElementById('next-btn').disabled = state.current === questions.length - 1;

      renderMap();
    }

    function selectAlternative(i) {
      if (state.answers[state.current]) return;
      const q = questions[state.current];
      state.answers[state.current] = {
        selected: i,
        correct: i === q.correct
      };
      renderQuestion();
    }

    function isStruck(qIndex, altIndex) {
      return !!(state.struck[qIndex] && state.struck[qIndex][altIndex]);
    }

    function toggleStrike(event, qIndex, altIndex) {
      event.stopPropagation();
      if (!state.struck[qIndex]) state.struck[qIndex] = {};
      state.struck[qIndex][altIndex] = !state.struck[qIndex][altIndex];
      renderQuestion();
    }

    function toggleAux(index) {
      state.auxOpen[index] = !state.auxOpen[index];
      renderQuestion();
    }

    function goToQuestion(i) {
      state.current = i;
      renderQuestion();
      document.getElementById('map-panel').classList.remove('open');
    }

    function prevQuestion() {
      if (state.current > 0) goToQuestion(state.current - 1);
    }

    function nextQuestion() {
      if (state.current < questions.length - 1) goToQuestion(state.current + 1);
    }

    function renderMap() {
      const grid = document.getElementById('map-grid');
      grid.innerHTML = questions.map((q, i) => {
        const answer = state.answers[i];
        let cls = 'map-cell';
        if (answer) cls += ' answered';
        if (i === state.current) cls += ' current';
        const answerText = answer ? letterFor(answer.selected) : '-';
        return `<button class="${cls}" onclick="goToQuestion(${i})">
          <div class="cell-header">${i + 1}</div>
          <div class="cell-answer">${answerText}</div>
        </button>`;
      }).join('');
    }

    function toggleMap() {
      document.getElementById('map-panel').classList.toggle('open');
    }

    /* ─── CRONÔMETRO ─── */
    function updateTimerDisplay() {
      document.getElementById('timer-display').textContent = formatTime(state.seconds);
    }

    function tick() {
      if (TIMER_MODE === 'decrescente') {
        state.seconds = Math.max(0, state.seconds - 1);
        if (state.seconds === 0) clearInterval(state.timerId);
      } else {
        state.seconds++;
      }
      updateTimerDisplay();
    }

    function startTimer() {
      state.timerId = setInterval(tick, 1000);
    }

    /* ─── PAUSAR ─── */
    function togglePause() {
      state.paused = !state.paused;
      document.getElementById('question-wrapper').classList.toggle('paused', state.paused);

      if (state.paused) {
        clearInterval(state.timerId);
        document.getElementById('pause-label').textContent = 'Continuar';
      } else {
        startTimer();
        document.getElementById('pause-label').textContent = 'Pausar';
      }
    }

    /* ─── FINALIZAR ─── */
    function openFinalizarModal() {
      document.getElementById('confirm-respondidas').textContent = Object.keys(state.answers).length;
      document.getElementById('confirm-total').textContent = questions.length;
      document.getElementById('confirm-overlay').classList.add('open');
    }

    function closeFinalizarModal() {
      document.getElementById('confirm-overlay').classList.remove('open');
    }

    document.getElementById('confirm-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'confirm-overlay') closeFinalizarModal();
    });

    function finalizarSimulado() {
      clearInterval(state.timerId);
      const respondidas = Object.values(state.answers);
      const resultado = {
        nome: SIMULADO_NOME,
        total: questions.length,
        respondidas: respondidas.length,
        corretas: respondidas.filter((a) => a.correct).length,
        erradas: respondidas.filter((a) => !a.correct).length,
        tempoSegundos: state.seconds,
        detalhe: questions.map((q, i) => {
          const answer = state.answers[i];
          return {
            numero: i + 1,
            id: q.id,
            materia: q.materia,
            assunto: q.assunto,
            banca: q.banca,
            texto: q.text,
            alternativas: q.alternatives,
            correctIndex: q.correct,
            selecionada: answer ? letterFor(answer.selected) : null,
            correta: letterFor(q.correct),
            status: answer ? (answer.correct ? 'correta' : 'errada') : 'nao-respondida'
          };
        })
      };
      localStorage.setItem('resultadoSimulado', JSON.stringify(resultado));
      window.location.href = 'relatorio-simulado.html';
    }

    updateTimerDisplay();
    renderQuestion();
    startTimer();
  </script>
