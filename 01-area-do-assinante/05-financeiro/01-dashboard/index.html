<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · Proluno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../../04-design-system/proluno.css">
<style>
  /* Cores dos status: as mesmas dos Status do Design System */
  :root { --st-pagas: var(--success); --st-aguardando: var(--primary); --st-recusadas: var(--danger); --st-estornadas: var(--ink-faint); --st-chargeback: var(--warning); }

  .db-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .db-head > div:first-child { flex: 1 1 360px; min-width: 0; }
  .db-head .pl-page-lead { margin: 10px 0 0; font-size: 16px; }
  .db-head .pl-page-lead strong { font-weight: 600; color: var(--ink-body); }
  .db-balances { flex: 0 1 460px; }
  .db-balances .pl-metric { padding: 14px 18px; }
  .db-neg { color: var(--danger-strong); }

  .db-filters { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .db-period { position: relative; display: flex; align-items: center; gap: 8px; }
  .db-cal-btn { width: 40px; height: 40px; padding: 0; color: var(--ink-secondary); }
  .db-cal-btn svg { width: 17px; height: 17px; }
  /* Período personalizado em uso: estado "selecionado" do Design System (borda primary + fundo primary-selected) */
  .db-cal-btn.is-selected { border-color: var(--primary); background: var(--primary-selected); color: var(--primary); }
  /* Calendário de período: dois meses lado a lado, como no protótipo de referência */
  .db-range { position: absolute; top: calc(100% + 6px); left: 0; z-index: var(--z-popover); display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-10); box-shadow: var(--shadow-popover); }
  .db-range[hidden] { display: none; }
  .db-cal { width: 260px; padding: 16px 14px 14px; }
  .db-cal + .db-cal { border-left: 1px solid var(--line); }
  .db-cal .pl-field { margin: 0 4px 14px; }
  .db-cal .pl-input input { font-size: 14px; }
  .db-cal-head { position: relative; display: flex; align-items: center; justify-content: center; height: 28px; margin-bottom: 8px; }
  .db-cal-month { font-size: 14px; font-weight: 500; color: var(--ink-secondary); }
  .db-cal-nav { position: absolute; top: 0; }
  .db-cal-nav.is-prev { left: 0; }
  .db-cal-nav.is-next { right: 0; }
  .db-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
  .db-cal-wd { padding: 6px 0; font-size: 11.5px; font-weight: 600; color: var(--ink-faint); text-align: center; }
  .db-day { position: relative; height: 32px; padding: 0; border: 0; background: none; font-family: var(--font-sans); font-size: 13.5px; color: var(--ink-body); cursor: pointer; font-variant-numeric: tabular-nums; }
  .db-day span { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; }
  .db-day:hover span { background: var(--bg-muted); }
  .db-day.is-in { background: var(--primary-tint-strong); }
  .db-day.is-in:hover span { background: transparent; }
  .db-day.is-row-start, .db-day.is-start { border-radius: 16px 0 0 16px; }
  .db-day.is-row-end, .db-day.is-end { border-radius: 0 16px 16px 0; }
  .db-day.is-row-start.is-row-end, .db-day.is-start.is-row-end, .db-day.is-row-start.is-end, .db-day.is-start.is-end { border-radius: 16px; }
  .db-day.is-start span, .db-day.is-end span { background: var(--primary) !important; color: var(--on-primary); font-weight: 600; }
  .db-day.is-start:not(.is-end) { background: linear-gradient(90deg, transparent 50%, var(--primary-tint-strong) 50%); }
  .db-day.is-end:not(.is-start) { background: linear-gradient(90deg, var(--primary-tint-strong) 50%, transparent 50%); }
  .db-day.is-start.is-row-end:not(.is-end), .db-day.is-end.is-row-start:not(.is-start) { background: none; }
  .db-day.is-today:not(.is-start):not(.is-end) span { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .db-day.is-other { visibility: hidden; }
  .db-only-mobile { display: none !important; }
  .db-product { display: flex; align-items: center; gap: 12px; flex: 1 1 320px; max-width: 520px; margin-left: auto; }
  .db-product .pl-select-wrap { flex: 1 1 auto; min-width: 0; }
  .db-product select { appearance: none; -webkit-appearance: none; padding-right: 36px; color: var(--ink-body); }
  .db-product .pl-select-wrap > svg { position: absolute; top: 50%; right: 12px; width: 15px; height: 15px; color: var(--ink-faint); transform: translateY(-50%); pointer-events: none; }
  .db-applied { margin-top: -12px; font-size: 13px; color: var(--ink-muted); }
  .db-applied strong { color: var(--ink-body); font-weight: 600; }

  .db-kpis .pl-kpi-head { margin-bottom: 10px; }
  .db-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
  .db-card-title { margin: 0 0 18px; font-size: 16px; font-weight: 700; color: var(--ink-heading); }
  .db-status { display: flex; align-items: center; gap: 28px; }
  .db-donut { position: relative; width: 168px; height: 168px; flex-shrink: 0; }
  .db-donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .db-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .db-donut-center strong { font-size: 26px; font-weight: 700; color: var(--ink-heading); font-variant-numeric: tabular-nums; }
  .db-donut-center span { font-size: 12.5px; color: var(--ink-muted); }
  .db-legend { flex: 1 1 auto; min-width: 0; margin: 0; padding: 0; list-style: none; }
  .db-legend li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; color: var(--ink-body); }
  .db-legend li:last-child { border-bottom: 0; }
  .db-legend li.is-zero { color: var(--ink-faint); }
  .db-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .db-legend-val { margin-left: auto; font-weight: 700; color: var(--ink-heading); font-variant-numeric: tabular-nums; }
  .db-legend li.is-zero .db-legend-val { font-weight: 500; color: var(--ink-faint); }
  .db-pay { margin: 0; padding: 0; list-style: none; }
  .db-pay li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; color: var(--ink-body); }
  .db-pay li:last-child { border-bottom: 0; }
  .db-pay-icon { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: var(--radius-8); background: var(--bg-inset); color: var(--ink-secondary); flex-shrink: 0; }
  .db-pay-icon svg { width: 17px; height: 17px; }
  .db-pay-val { margin-left: auto; font-weight: 700; color: var(--ink-heading); text-align: right; font-variant-numeric: tabular-nums; }
  .db-pay-val small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-muted); }
  .db-pay-val.is-zero { font-weight: 600; color: var(--ink-faint); }
  .db-products td { font-variant-numeric: tabular-nums; }

  .db-chart-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .db-chart-head .db-card-title { margin: 0; }
  .db-chart-sub { margin: 4px 0 0; font-size: 13px; color: var(--ink-muted); }
  .db-chart-sub strong { color: var(--ink-body); }
  .db-chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 12px; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink-secondary); }
  .db-chart-legend li { display: inline-flex; align-items: center; gap: 6px; }
  .db-chart-legend .db-dot { width: 8px; height: 8px; border-radius: 2px; }
  .db-chart-scroll { position: relative; overflow: hidden; }
  .db-chart { position: relative; min-width: 560px; }
  .db-chart svg { display: block; width: 100%; height: 260px; overflow: visible; }
  .db-chart .db-axis { font-family: var(--font-sans); font-size: 11px; fill: var(--ink-faint); }
  .db-chart .db-grid { stroke: var(--line-soft); }
  .db-chart .db-hit { fill: transparent; cursor: pointer; outline: 0; }
  .db-chart .db-hit:hover, .db-chart .db-hit:focus-visible, .db-chart .db-hit.is-on { fill: var(--primary-alpha-15); fill-opacity: .35; }
  .db-tip { position: absolute; z-index: 5; min-width: 180px; padding: 10px 12px; border-radius: var(--radius-8); background: var(--ink-heading); color: var(--on-primary); font-size: 12.5px; line-height: 1.5; pointer-events: none; }
  .db-tip strong { display: block; margin-bottom: 4px; font-size: 12.5px; }
  .db-tip div { display: flex; align-items: center; gap: 8px; }
  .db-tip div span:last-child { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .db-chart-empty { padding: 48px 20px; }

  @media (max-width: 1080px) {
    .db-row { grid-template-columns: 1fr; }
    .db-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 768px) {
    .db-head .pl-page-lead { font-size: 14px; }
    .db-balances { flex-basis: 100%; }
    .db-balances .pl-metric { padding: 12px 14px; }
    .db-filters { gap: 10px; }
    .db-period { width: 100%; }
    .db-period .pl-segmented { flex: 1 1 auto; flex-wrap: nowrap; min-width: 0; }
    .db-period .pl-segment { flex: 1 0 auto; padding: 9px 6px; }
    .db-cal-btn { flex-shrink: 0; width: 44px; height: 44px; }
    .db-range { grid-template-columns: 1fr 1fr; width: 100%; }
    .db-only-mobile { display: inline-flex !important; }
    /* Um mês por vez: os dois campos lado a lado no topo, um calendário e o Filtrar no rodapé */
    .db-range { column-gap: 10px; padding: 14px; }
    .db-cal { display: contents; }
    .db-cal:first-child > .pl-field { grid-column: 1; grid-row: 1; margin: 0 0 12px; }
    .db-cal:nth-child(2) > .pl-field { grid-column: 2; grid-row: 1; margin: 0 0 12px; }
    .db-cal:first-child > .db-cal-head { grid-column: 1 / -1; grid-row: 2; }
    .db-cal:first-child > .db-cal-grid { grid-column: 1 / -1; grid-row: 3; }
    .db-cal:nth-child(2) > .db-cal-head, .db-cal:nth-child(2) > .db-cal-grid { display: none; }
    .db-cal-foot { grid-column: 1 / -1; grid-row: 4; display: block !important; margin-top: 12px; }
    .db-cal { width: auto; }
    .db-cal + .db-cal { border-left: 0; }
    .db-cal .pl-input input { font-size: 16px; }
    .db-day { height: 40px; }
    .db-day span { width: 36px; height: 36px; }
    .db-day.is-row-start, .db-day.is-start { border-radius: 20px 0 0 20px; }
    .db-day.is-row-end, .db-day.is-end { border-radius: 0 20px 20px 0; }
    .db-product { flex-basis: 100%; max-width: none; margin-left: 0; }
    .db-product select { font-size: 16px; }
    .db-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px; }
    .db-kpis .pl-kpi { padding: 14px; }
    .db-kpis .pl-kpi-value { font-size: 20px; }
    .db-kpis .pl-kpi-label { font-size: 12.5px; }
    .db-status { flex-direction: column; align-items: stretch; gap: 16px; }
    .db-donut { align-self: center; width: 150px; height: 150px; }
    .pl-card.db-card { padding: 18px 16px; }
    .db-chart-scroll { overflow-x: auto; overflow-y: hidden; }
    /* Lista de produtos vira linhas empilhadas: nome em cima, quantidade e faturamento embaixo */
    .db-products thead { display: none; }
    .db-products tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
    .db-products tbody tr:last-child { border-bottom: 0; }
    .db-products td { display: block; padding: 0; border: 0; }
    .db-products td:first-child { grid-column: 1 / -1; font-size: 14px; }
    .db-products td:nth-child(2) { text-align: left; font-size: 13px; color: var(--ink-muted); }
    .db-products td:nth-child(2)::after { content: " vendas"; }
    .db-products td:nth-child(3) { font-size: 14px; }
  }
</style>
</head>
<body data-page="05-financeiro/01-dashboard/">

<div class="pl-app">
  <!-- Menu principal (vira gaveta abaixo de 768px) -->
  <aside class="pl-app-sidebar" id="appNav" aria-label="Menu principal">
    <div class="pl-app-brand">
      <a href="../../01-inicio/" aria-label="Proluno — Início"><span class="pl-logo">Prol<span class="pl-logo-dots"><i class="d-teal"></i><i class="d-pink"></i><i class="d-orange"></i><i class="d-blue"></i></span><span class="pl-logo-accent">uno.</span></span></a>
      <button class="pl-icon-btn pl-icon-btn--close pl-drawer-close" type="button" data-nav-close aria-label="Fechar menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-x"/></svg></button>
    </div>
    <nav class="pl-nav" id="appNavList"></nav>
  </aside>
  <div class="pl-backdrop" id="navBackdrop" data-nav-close></div>

  <div class="pl-app-main">
    <header class="pl-mobile-topbar">
      <button class="pl-menu-toggle" type="button" id="navOpen" aria-label="Abrir menu" aria-controls="appNav" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-menu"/></svg></button>
      <span class="pl-logo">Prol<span class="pl-logo-dots"><i class="d-teal"></i><i class="d-pink"></i><i class="d-orange"></i><i class="d-blue"></i></span><span class="pl-logo-accent">uno.</span></span>
      <button class="pl-header-btn" type="button" aria-label="Notificações, 10 novas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bell"/></svg><span class="pl-count-dot">10</span></button>
    </header>
    <header class="pl-app-header">
      <button class="pl-header-btn" type="button" aria-label="Notificações, 10 novas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bell"/></svg><span class="pl-count-dot">10</span></button>
      <a class="pl-user-btn" href="../../08-configuracoes/01-editar-perfil/" aria-label="Meu perfil"><span class="pl-avatar pl-avatar--sm pl-avatar--orange">JF</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron-down"/></svg></a>
    </header>

    <main class="pl-page pl-app-content">
      <div class="pl-stack">
        <div class="db-head">
          <div>
            <h1 class="pl-page-title">Olá, Júlia Fonseca!</h1>
            <p class="pl-page-lead" id="periodText"></p>
          </div>
          <section class="pl-metrics pl-metrics--split db-balances" aria-label="Saldos">
            <div class="pl-metric"><span class="pl-metric-icon pl-metric-icon--orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-wallet"/></svg></span><div><div class="pl-metric-value db-neg" id="balAvail"></div><div class="pl-metric-label">Saldo disponível</div></div></div>
            <div class="pl-metric"><span class="pl-metric-icon pl-metric-icon--blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-clock"/></svg></span><div><div class="pl-metric-value" id="balFuture"></div><div class="pl-metric-label">Saldo a receber</div></div></div>
          </section>
        </div>

        <div class="db-filters">
          <div class="db-period">
            <div class="pl-segmented" role="group" aria-label="Período">
              <button class="pl-segment" type="button" data-period="hoje">Hoje</button>
              <button class="pl-segment" type="button" data-period="7">7 dias</button>
              <button class="pl-segment" type="button" data-period="15">15 dias</button>
              <button class="pl-segment" type="button" data-period="30">30 dias</button>
            </div>
            <button class="pl-btn pl-btn--secondary db-cal-btn" type="button" id="customBtn" aria-label="Escolher período personalizado" title="Escolher período personalizado" aria-haspopup="dialog" aria-expanded="false" aria-pressed="false" aria-controls="range"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-calendar"/></svg></button>
            <div class="db-range" id="range" role="dialog" aria-label="Escolher período" hidden>
              <div class="db-cal">
                <div class="pl-field pl-field--compact"><label for="dStart">Data inicial</label><div class="pl-input pl-input--compact"><input type="date" id="dStart"></div></div>
                <div class="db-cal-head"><button class="pl-icon-btn db-cal-nav is-prev" type="button" data-move="-1" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron-left"/></svg></button><span class="db-cal-month" id="mLeft"></span><button class="pl-icon-btn db-cal-nav is-next db-only-mobile" type="button" data-move="1" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron-right"/></svg></button></div>
                <div class="db-cal-grid" id="gLeft"></div>
              </div>
              <div class="db-cal">
                <div class="pl-field pl-field--compact"><label for="dEnd">Data final</label><div class="pl-input pl-input--compact"><input type="date" id="dEnd"></div></div>
                <div class="db-cal-head"><span class="db-cal-month" id="mRight"></span><button class="pl-icon-btn db-cal-nav is-next" type="button" data-move="1" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron-right"/></svg></button></div>
                <div class="db-cal-grid" id="gRight"></div>
              </div>
              <div class="db-cal-foot db-only-mobile"><button class="pl-btn pl-btn--primary pl-btn--block" type="submit" form="productForm">Filtrar</button></div>
            </div>
          </div>
          <form class="db-product" id="productForm">
            <div class="pl-select-wrap">
              <select class="pl-select" id="product" aria-label="Produto"></select>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-down"/></svg>
            </div>
            <button class="pl-btn pl-btn--secondary pl-btn--sm" type="submit" id="filterBtn">Filtrar</button>
          </form>
        </div>
        <p class="db-applied" id="applied" hidden></p>

        <section class="pl-kpi-grid db-kpis" aria-label="Resumo do período">
          <div class="pl-kpi"><div class="pl-kpi-head"><span class="pl-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-cart"/></svg></span><span class="pl-kpi-label">Nº de produtos vendidos</span></div><div class="pl-kpi-value" id="kSold"></div></div>
          <div class="pl-kpi"><div class="pl-kpi-head"><span class="pl-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-swap"/></svg></span><span class="pl-kpi-label">Transações</span></div><div class="pl-kpi-value" id="kTx"></div></div>
          <div class="pl-kpi"><div class="pl-kpi-head"><span class="pl-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-receipt"/></svg></span><span class="pl-kpi-label">Faturamento</span></div><div class="pl-kpi-value" id="kRev"></div></div>
          <div class="pl-kpi"><div class="pl-kpi-head"><span class="pl-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-trending"/></svg></span><span class="pl-kpi-label">Ticket médio</span></div><div class="pl-kpi-value" id="kTicket"></div></div>
        </section>

        <div class="db-row">
          <section class="pl-card db-card" aria-labelledby="tStatus">
            <h2 class="db-card-title" id="tStatus">Transações por status</h2>
            <div class="db-status">
              <div class="db-donut"><svg viewBox="0 0 120 120" aria-hidden="true" id="donut"></svg><div class="db-donut-center"><strong id="donutTotal">0</strong><span id="donutLabel">transações</span></div></div>
              <ul class="db-legend" id="legend"></ul>
            </div>
          </section>
          <section class="pl-card db-card" aria-labelledby="tPay">
            <h2 class="db-card-title" id="tPay">Formas de pagamento</h2>
            <ul class="db-pay">
              <li><span class="db-pay-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-card"/></svg></span>Cartão de crédito<span class="db-pay-val" data-pay="cartao">–</span></li>
              <li><span class="db-pay-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-barcode"/></svg></span>Boleto<span class="db-pay-val" data-pay="boleto">–</span></li>
              <li><span class="db-pay-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-pix"/></svg></span>Pix<span class="db-pay-val" data-pay="pix">–</span></li>
            </ul>
          </section>
        </div>

        <section class="pl-card db-card" aria-labelledby="tChart">
          <div class="db-chart-head">
            <div>
              <h2 class="db-card-title" id="tChart">Transações por dia</h2>
              <p class="db-chart-sub" id="chartSub"></p>
            </div>
            <div class="pl-segmented" role="group" aria-label="Mostrar no gráfico">
              <button class="pl-segment is-active" type="button" data-metric="qtd" aria-pressed="true">Qtd.</button>
              <button class="pl-segment" type="button" data-metric="rs" aria-pressed="false">R$</button>
            </div>
          </div>
          <ul class="db-chart-legend" id="chartLegend"></ul>
          <div class="db-chart-scroll"><div class="db-chart" id="chart"></div></div>
        </section>

        <section class="pl-card db-card" aria-labelledby="tProducts">
          <h2 class="db-card-title" id="tProducts">Lista de produtos</h2>
          <div id="productList"></div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="../../assets/app-shell.js"></script>
<script>
(function () {
  var S = window.PLShell, icon = S.icon, esc = S.esc;

  /* ---------- Dados (os do sandbox, como na versão anterior) ---------- */
  var TODAY = '2026-10-23';
  var BALANCE = { available: -0.23, future: 1.76 };
  var STATUS = [
    { key: 'pagas', label: 'Pagas' },
    { key: 'aguardando', label: 'Aguardando pagamento' },
    { key: 'recusadas', label: 'Recusadas' },
    { key: 'estornadas', label: 'Estornadas' },
    { key: 'chargeback', label: 'Chargeback' }
  ];
  /* Transações por dia e status: quantidade e valor */
  var TX = [
    { d: '2026-09-24', s: 'estornadas', q: 1, v: 27.28 },
    { d: '2026-09-28', s: 'aguardando', q: 1, v: 1819.27 },
    { d: '2026-10-08', s: 'recusadas', q: 1, v: 9.11 },
    { d: '2026-10-08', s: 'estornadas', q: 5, v: 153.22 },
    { d: '2026-10-15', s: 'estornadas', q: 1, v: 9.11 },
    { d: '2026-10-16', s: 'estornadas', q: 1, v: 9.11 },
    { d: '2026-10-20', s: 'estornadas', q: 2, v: 18.22 }
  ];
  /* Vendas pagas fictícias (produto, preço e dias de venda, com a forma de pagamento) */
  var SALES = [
    { p: 'Mentoria Imparável', price: 997, at: [['2026-10-01', 'cartao'], ['2026-10-21', 'cartao']] },
    { p: 'Aprova Concursos', price: 397, at: [['2026-09-27', 'boleto'], ['2026-10-06', 'cartao'], ['2026-10-17', 'cartao'], ['2026-10-23', 'pix']] },
    { p: 'Direito Constitucional na Prática', price: 199, at: [['2026-09-25', 'cartao'], ['2026-10-02', 'pix'], ['2026-10-09', 'cartao'], ['2026-10-14', 'pix'], ['2026-10-19', 'cartao'], ['2026-10-22', 'pix']] },
    { p: 'Treino Discursivas', price: 49, at: [['2026-09-24', 'pix'], ['2026-09-30', 'pix'], ['2026-10-05', 'pix'], ['2026-10-11', 'boleto'], ['2026-10-13', 'pix'], ['2026-10-18', 'pix'], ['2026-10-20', 'cartao'], ['2026-10-22', 'pix'], ['2026-10-23', 'pix']] },
    { p: 'IA para Iniciantes', price: 29.9, at: [['2026-10-03', 'pix'], ['2026-10-16', 'cartao'], ['2026-10-21', 'pix']] }
  ];
  SALES.forEach(function (x) { x.at.forEach(function (a) { TX.push({ d: a[0], s: 'pagas', q: 1, v: x.price, p: x.p, m: a[1] }); }); });
  var PRODUCTS = ['Preparatório Farmácia para Concursos e Residências', 'Teste', 'Direito Constitucional na Prática', 'Festival das Imparáveis', 'Treino Discursivas',
    'Direito Constitucional para Iniciantes', 'Gold Face', 'A Verdadeira Harmonia', 'Além do Óbvio', 'Presets - Posts Incríveis', 'Imagem de Influência', 'Mentoria Imparável',
    'Direitos e Garantias Fundamentais em Questões', 'Controle de Constitucionalidade na Prática', 'Mentoria Imparável + Bônus', 'Turma Além do Óbvio + Bônus',
    'TJCE DA APROVAÇÃO', 'Aprova Concursos', 'Oficial de Justiça - TJCE 2026', 'Blusa Aulão GCM', 'Gravação Aulão GCM', 'AULÃO GCM', 'IA para Iniciantes'];

  var BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  function money(n) { return BRL.format(n); }
  function int(n) { return n.toLocaleString('pt-BR'); }
  function parse(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function br(isoStr) { var p = isoStr.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function addDays(isoStr, n) { var d = parse(isoStr); d.setDate(d.getDate() + n); return iso(d); }
  function days(a, b) { var out = []; for (var d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }

  /* ---------- Estado ---------- */
  var state = { period: '30', start: addDays(TODAY, -30), end: TODAY, metric: 'qtd', product: '' };
  function setPeriod(p) {
    state.period = p;
    if (p === 'hoje') state.start = TODAY;
    else if (p !== 'custom') state.start = addDays(TODAY, -(+p));
    if (p !== 'custom') state.end = TODAY;
    render();
  }

  /* ---------- Saldos ---------- */
  document.getElementById('balAvail').textContent = money(BALANCE.available);
  document.getElementById('balAvail').classList.toggle('db-neg', BALANCE.available < 0);
  document.getElementById('balFuture').textContent = money(BALANCE.future);

  /* ---------- Produto ---------- */
  var sel = document.getElementById('product');
  sel.innerHTML = '<option value="">Todos os produtos</option>' + PRODUCTS.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('');
  /* Filtrar aplica o produto e o período escolhido no calendário, como no original */
  var filterBtn = document.getElementById('filterBtn'), draft = {};
  function pendingChanges() { return sel.value !== state.product || (draft.start && (draft.start !== state.start || draft.end !== state.end)); }
  function syncFilterBtn() { var p = pendingChanges(); filterBtn.classList.toggle('pl-btn--primary', !!p); filterBtn.classList.toggle('pl-btn--secondary', !p); }
  sel.addEventListener('change', syncFilterBtn);
  document.getElementById('productForm').addEventListener('submit', function (e) {
    e.preventDefault();
    state.product = sel.value;
    if (draft.start && (draft.start !== state.start || draft.end !== state.end)) { state.start = draft.start; state.end = draft.end; state.period = 'custom'; }
    draft = {}; setRange(false); render(); syncFilterBtn();
  });

  /* ---------- Render ---------- */
  function inRange() { return TX.filter(function (t) { return t.d >= state.start && t.d <= state.end && (!state.product || t.p === state.product); }); }

  function render() {
    document.querySelectorAll('[data-period]').forEach(function (b) { var on = b.getAttribute('data-period') === state.period; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on); });
    var custom = state.period === 'custom', cb = document.getElementById('customBtn');
    cb.classList.toggle('is-selected', custom); cb.setAttribute('aria-pressed', custom);
    cb.title = custom ? 'Período personalizado: ' + br(state.start) + ' a ' + br(state.end) : 'Escolher período personalizado';
    document.getElementById('periodText').innerHTML = 'Aqui está um resumo da sua conta no período <strong>' + br(state.start) + ' a ' + br(state.end) + '</strong>.';
    var applied = document.getElementById('applied');
    applied.hidden = !state.product; applied.innerHTML = state.product ? 'Mostrando: <strong>' + esc(state.product) + '</strong>' : '';

    var list = inRange(), totals = {}, values = {};
    STATUS.forEach(function (s) { totals[s.key] = 0; values[s.key] = 0; });
    list.forEach(function (t) { totals[t.s] += t.q; values[t.s] += t.v; });
    var paidQ = totals.pagas, paidV = values.pagas;

    renderPayments(list); renderProducts(list);
    document.getElementById('kSold').textContent = int(paidQ);
    document.getElementById('kTx').textContent = int(paidQ);
    document.getElementById('kRev').textContent = money(paidV);
    document.getElementById('kTicket').textContent = money(paidQ ? paidV / paidQ : 0);

    renderDonut(totals);
    /* Mesma contagem dos botões de período (o original mostra "30 dia(s)" para 23/09 a 23/10) */
    var n = state.period === 'hoje' ? 1 : state.period === 'custom' ? days(state.start, state.end).length : +state.period;
    document.getElementById('chartSub').innerHTML = plural(n, 'dia', 'dias') + ' · <strong>' + int(paidQ) + '</strong> ' + (paidQ === 1 ? 'transação capturada' : 'transações capturadas') + ' · <strong>' + money(paidV) + '</strong>';
    renderChart(list);
  }
  function plural(n, a, b) { return int(n) + ' ' + (n === 1 ? a : b); }

  function renderPayments(list) {
    var by = { cartao: { q: 0, v: 0 }, boleto: { q: 0, v: 0 }, pix: { q: 0, v: 0 } };
    list.forEach(function (t) { if (t.s === 'pagas') { by[t.m].q += t.q; by[t.m].v += t.v; } });
    document.querySelectorAll('[data-pay]').forEach(function (el) {
      var x = by[el.getAttribute('data-pay')];
      el.classList.toggle('is-zero', !x.q);
      el.innerHTML = x.q ? money(x.v) + '<small>' + plural(x.q, 'venda', 'vendas') + '</small>' : '–';
    });
  }

  function renderProducts(list) {
    var by = {};
    list.forEach(function (t) { if (t.s !== 'pagas') return; var x = by[t.p] = by[t.p] || { name: t.p, q: 0, v: 0 }; x.q += t.q; x.v += t.v; });
    var rows = Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return b.v - a.v; });
    var el = document.getElementById('productList');
    if (!rows.length) {
      el.innerHTML = '<div class="pl-empty pl-empty--dashed"><div class="pl-empty-icon">' + icon('package', '', 1.8) + '</div><p class="pl-empty-text" style="max-width:none">Ainda não há informações disponíveis.</p></div>';
      return;
    }
    el.innerHTML = '<div class="pl-table-wrap"><table class="pl-table db-products"><thead><tr><th>Nome</th><th class="is-right">Qtd de vendas</th><th class="is-right">Faturamento (R$)</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td class="pl-cell-strong" data-label="Nome">' + esc(r.name) + '</td><td class="is-right" data-label="Qtd de vendas">' + int(r.q) + '</td><td class="is-right pl-cell-amount" data-label="Faturamento (R$)">' + money(r.v) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function renderDonut(totals) {
    var total = STATUS.reduce(function (a, s) { return a + totals[s.key]; }, 0);
    var C = 2 * Math.PI * 48, off = 0, segs = '';
    STATUS.forEach(function (s) {
      var q = totals[s.key]; if (!q) return;
      var len = C * q / total;
      segs += '<circle cx="60" cy="60" r="48" fill="none" stroke="var(--st-' + s.key + ')" stroke-width="16" stroke-dasharray="' + Math.max(len - 1.5, 0.5) + ' ' + (C - Math.max(len - 1.5, 0.5)) + '" stroke-dashoffset="' + (-off) + '"/>';
      off += len;
    });
    document.getElementById('donut').innerHTML = '<circle cx="60" cy="60" r="48" fill="none" stroke="var(--bg-track)" stroke-width="16"/>' + segs;
    document.getElementById('donutTotal').textContent = int(total);
    document.getElementById('donutLabel').textContent = total === 1 ? 'transação' : 'transações';
    document.getElementById('legend').innerHTML = STATUS.map(function (s) {
      var q = totals[s.key];
      return '<li class="' + (q ? '' : 'is-zero') + '"><span class="db-dot" style="background:var(--st-' + s.key + ')"></span>' + s.label + '<span class="db-legend-val">' + int(q) + '</span></li>';
    }).join('');
  }

  /* ---------- Gráfico por dia (barras empilhadas por status) ---------- */
  var chart = document.getElementById('chart'), tip = null;
  function niceMax(v) {
    if (v <= 0) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function renderChart(list) {
    var ds = days(state.start, state.end), byDay = {};
    ds.forEach(function (d) { byDay[d] = {}; });
    list.forEach(function (t) { var x = byDay[t.d]; x[t.s] = x[t.s] || { q: 0, v: 0 }; x[t.s].q += t.q; x[t.s].v += t.v; });
    var metric = state.metric, used = {};
    var max = 0;
    ds.forEach(function (d) { var sum = 0; STATUS.forEach(function (s) { var c = byDay[d][s.key]; if (c) { used[s.key] = 1; sum += metric === 'qtd' ? c.q : c.v; } }); if (sum > max) max = sum; });

    document.getElementById('chartLegend').innerHTML = STATUS.filter(function (s) { return used[s.key]; }).map(function (s) {
      return '<li><span class="db-dot" style="background:var(--st-' + s.key + ')"></span>' + s.label + '</li>';
    }).join('');

    if (!list.length) {
      chart.style.minWidth = '0';
      chart.innerHTML = '<div class="pl-empty db-chart-empty"><div class="pl-empty-icon">' + icon('bars', '', 1.8) + '</div><p class="pl-empty-text">Nenhuma transação neste período.</p></div>';
      return;
    }
    chart.style.minWidth = '';
    var W = Math.max(chart.clientWidth || 560, 560), H = 260, L = metric === 'qtd' ? 30 : 74, R = 24, T = 10, B = 28;
    var top, steps;
    if (metric === 'qtd') { var step = Math.max(1, Math.ceil(max / 4)); top = step * Math.ceil(max / step); steps = top / step; }
    else { top = niceMax(max); steps = 4; }
    var iw = W - L - R, ih = H - T - B, slot = iw / ds.length, bw = Math.min(28, Math.max(4, slot * 0.6));
    var y = function (v) { return T + ih - (v / top) * ih; };
    var svg = '';
    for (var i = 0; i <= steps; i++) {
      var val = top * i / steps, yy = y(val);
      svg += '<line class="db-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/>' +
        '<text class="db-axis" x="' + (L - 8) + '" y="' + yy + '" text-anchor="end" dominant-baseline="middle">' + (metric === 'qtd' ? int(Math.round(val)) : money(val).replace(',00', '')) + '</text>';
    }
    var every = Math.ceil(ds.length / Math.max(1, Math.floor(iw / 76)));
    ds.forEach(function (d, i) {
      var cx = L + slot * i + slot / 2, acc = 0, cell = byDay[d];
      svg += '<rect class="db-hit" data-day="' + d + '" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + ih + '" tabindex="0" role="img" aria-label="' + esc(tipText(d, cell)) + '"/>';
      STATUS.forEach(function (s) {
        var c = cell[s.key]; if (!c) return;
        var v = metric === 'qtd' ? c.q : c.v, y0 = y(acc), y1 = y(acc + v); acc += v;
        svg += '<rect x="' + (cx - bw / 2) + '" y="' + y1 + '" width="' + bw + '" height="' + Math.max(y0 - y1 - 1, 1) + '" rx="2" fill="var(--st-' + s.key + ')" pointer-events="none"/>';
      });
      if (i % every === 0 || ds.length === 1) svg += '<text class="db-axis" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + br(d).slice(0, 5) + '</text>';
    });
    chart.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="Transações por dia">' + svg + '</svg>';
    tip = null;
  }
  function tipText(d, cell) {
    var parts = STATUS.filter(function (s) { return cell[s.key]; }).map(function (s) { var c = cell[s.key]; return s.label + ': ' + c.q + ' (' + money(c.v) + ')'; });
    return br(d) + (parts.length ? ' — ' + parts.join(', ') : ' — sem transações');
  }
  function showTip(rect) {
    hideTip();
    var d = rect.getAttribute('data-day'), list = inRange().filter(function (t) { return t.d === d; });
    var rows = STATUS.map(function (s) {
      var q = 0, v = 0; list.forEach(function (t) { if (t.s === s.key) { q += t.q; v += t.v; } });
      return q ? '<div><span class="db-dot" style="background:var(--st-' + s.key + ')"></span><span>' + s.label + '</span><span>' + (state.metric === 'qtd' ? q : money(v)) + '</span></div>' : '';
    }).join('');
    tip = document.createElement('div'); tip.className = 'db-tip';
    tip.innerHTML = '<strong>' + br(d) + '</strong>' + (rows || '<div><span>Sem transações</span></div>');
    var box = chart.getBoundingClientRect(), r = rect.getBoundingClientRect();
    chart.appendChild(tip); rect.classList.add('is-on');
    /* Fica no alto do gráfico, ao lado da barra, sem sair pelas bordas */
    var w = tip.offsetWidth, cx = r.left + r.width / 2 - box.left;
    var left = cx + 12 + w > box.width ? cx - 12 - w : cx + 12;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '4px';
  }
  function hideTip() { if (tip) { tip.remove(); tip = null; } chart.querySelectorAll('.db-hit.is-on').forEach(function (h) { h.classList.remove('is-on'); }); }
  chart.addEventListener('mouseover', function (e) { var h = e.target.closest('.db-hit'); if (h) showTip(h); });
  chart.addEventListener('mouseleave', hideTip);
  chart.addEventListener('focusin', function (e) { var h = e.target.closest('.db-hit'); if (h) showTip(h); });
  chart.addEventListener('focusout', hideTip);
  chart.addEventListener('click', function (e) { var h = e.target.closest('.db-hit'); if (h) showTip(h); });
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { renderChart(inRange()); }, 120); });

  document.querySelectorAll('[data-metric]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.metric = b.getAttribute('data-metric');
      document.querySelectorAll('[data-metric]').forEach(function (x) { var on = x === b; x.classList.toggle('is-active', on); x.setAttribute('aria-pressed', on); });
      renderChart(inRange());
    });
  });

  /* ---------- Período ---------- */
  var range = document.getElementById('range'), customBtn = document.getElementById('customBtn');
  var dStart = document.getElementById('dStart'), dEnd = document.getElementById('dEnd');
  var MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var WD = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  var view = null, picking = 'start';

  function monthStart(isoStr) { return isoStr.slice(0, 8) + '01'; }
  function addMonths(isoStr, n) { var d = parse(isoStr); d.setDate(1); d.setMonth(d.getMonth() + n); return iso(d); }

  function grid(first) {
    var d0 = parse(first), m = d0.getMonth(), cells = '';
    cells += WD.map(function (w) { return '<span class="db-cal-wd" aria-hidden="true">' + w + '</span>'; }).join('');
    for (var b = 0; b < d0.getDay(); b++) cells += '<span class="db-day is-other"></span>';
    for (var d = new Date(d0); d.getMonth() === m; d.setDate(d.getDate() + 1)) {
      var k = iso(d), dow = d.getDay(), last = new Date(d); last.setDate(d.getDate() + 1);
      var cls = 'db-day';
      if (draft.start && draft.end && k > draft.start && k < draft.end) cls += ' is-in';
      if (k === draft.start) cls += ' is-start';
      if (k === draft.end) cls += ' is-end';
      if ((draft.start && draft.end && k >= draft.start && k <= draft.end)) {
        if (dow === 0 || d.getDate() === 1) cls += ' is-row-start';
        if (dow === 6 || last.getMonth() !== m) cls += ' is-row-end';
      }
      if (k === TODAY) cls += ' is-today';
      cells += '<button class="' + cls + '" type="button" data-date="' + k + '" aria-label="' + br(k) + '"' + (k === draft.start || k === draft.end ? ' aria-pressed="true"' : '') + '><span>' + d.getDate() + '</span></button>';
    }
    return cells;
  }
  function paint() {
    var right = addMonths(view, 1);
    document.getElementById('mLeft').textContent = MONTHS[parse(view).getMonth()] + ' ' + parse(view).getFullYear();
    document.getElementById('mRight').textContent = MONTHS[parse(right).getMonth()] + ' ' + parse(right).getFullYear();
    document.getElementById('gLeft').innerHTML = grid(view);
    document.getElementById('gRight').innerHTML = grid(right);
    dStart.value = draft.start || ''; dEnd.value = draft.end || '';
  }
  function setRange(open) {
    range.hidden = !open; customBtn.setAttribute('aria-expanded', open);
    if (open) {
      if (!draft.start) draft = { start: state.start, end: state.end };
      view = monthStart(draft.end); if (monthStart(draft.start) !== view) view = monthStart(draft.start);
      if (monthStart(draft.start) === monthStart(draft.end)) view = addMonths(view, -1);
      picking = 'start'; paint();
    }
  }
  function pick(k) {
    if (picking === 'start') { draft = { start: k, end: k }; picking = 'end'; }
    else { if (k < draft.start) { draft.end = draft.start; draft.start = k; } else draft.end = k; picking = 'start'; }
    paint(); syncFilterBtn();
  }
  range.addEventListener('click', function (e) {
    var day = e.target.closest('[data-date]'); if (day) { pick(day.getAttribute('data-date')); return; }
    var mv = e.target.closest('[data-move]'); if (mv) { view = addMonths(view, +mv.getAttribute('data-move')); paint(); }
  });
  function typed() {
    var a = dStart.value, b = dEnd.value; if (!a || !b) return;
    if (b < a) { var t = a; a = b; b = t; }
    draft = { start: a, end: b }; view = monthStart(a); picking = 'start'; paint(); syncFilterBtn();
  }
  dStart.addEventListener('change', typed); dEnd.addEventListener('change', typed);

  document.querySelectorAll('[data-period]').forEach(function (b) {
    b.addEventListener('click', function () { draft = {}; setRange(false); setPeriod(b.getAttribute('data-period')); syncFilterBtn(); });
  });
  customBtn.addEventListener('click', function () { setRange(range.hidden); });
  document.addEventListener('click', function (e) { if (!range.hidden && e.target.isConnected && !e.target.closest('.db-period') && !e.target.closest('#productForm')) setRange(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !range.hidden) { setRange(false); customBtn.focus(); } });

  render();
})();
</script>
</body>
