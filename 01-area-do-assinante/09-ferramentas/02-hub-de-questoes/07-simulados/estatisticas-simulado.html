<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estatísticas dos simulados</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ---------- Sidebar ---------- */

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background-color: #F1F1F1;
      padding: 28px 20px;
    }

    .content-col {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ---------- Topbar ---------- */

    .topbar {
      width: 100%;
      height: 56px;
      flex-shrink: 0;
      background-color: #F1F1F1;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #6b7280;
      text-decoration: none;
      margin-bottom: 18px;
    }

    .back-link svg {
      width: 14px;
      height: 14px;
    }

    .sidebar-title {
      font-size: 19px;
      font-weight: 700;
      color: #18181b;
      margin-bottom: 4px;
    }

    .sidebar-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: #9a9a9f;
      margin-bottom: 26px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #3f3f46;
      text-decoration: none;
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .nav-item.active {
      background-color: #ffffff;
      color: #E8761A;
      font-weight: 600;
    }

    /* ---------- Main ---------- */

    .main {
      flex: 1 1 auto;
      background-color: #ffffff;
      padding: 44px 48px 60px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .title-back-icon {
      width: 22px;
      height: 22px;
      color: #18181b;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #18181b;
    }

    .page-subtitle {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: #20212380;
      width: 100%;
      line-height: 1.5;
      margin: 20px 0 30px;
    }

    /* ---------- Busca e filtro ---------- */

    .list-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 1 auto;
      width: 320px;
      background-color: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      padding: 10px 12px;
    }

    .filter-select-wrap {
      position: relative;
      flex-shrink: 0;
      width: 190px;
    }

    .filter-select {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background-color: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13.5px;
      font-weight: 500;
      color: #71717a;
      cursor: pointer;
    }

    .filter-select svg {
      width: 15px;
      height: 15px;
      color: #71717a;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .filter-select.open svg {
      transform: rotate(180deg);
    }

    .filter-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background-color: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      z-index: 10;
    }

    .filter-menu.open {
      display: block;
    }

    .filter-option {
      padding: 10px 14px;
      font-size: 13.5px;
      color: #27272a;
      cursor: pointer;
    }

    .filter-option:hover {
      background-color: #f4f4f5;
    }

    .filter-option.selected {
      color: #E8761A;
      font-weight: 600;
    }

    .search-input-wrap svg {
      width: 15px;
      height: 15px;
      color: #a1a1aa;
      flex-shrink: 0;
    }

    .search-input-wrap input {
      border: none;
      outline: none;
      background: none;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      color: #1a1a1a;
      width: 100%;
    }

    .search-input-wrap input::placeholder {
      color: #a1a1aa;
    }

    /* ---------- Lista de alunos ---------- */

    .aluno-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .aluno-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: #F6F6F7;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 14px 20px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .aluno-row:hover {
      border-color: #e4e4e7;
    }

    .aluno-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #3f3f46;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .aluno-info {
      flex: 1 1 auto;
      min-width: 0;
    }

    .aluno-name {
      font-size: 15px;
      font-weight: 700;
      color: #18181b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .aluno-email {
      font-size: 13px;
      font-weight: 400;
      color: #71717a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .aluno-score {
      font-size: 15px;
      font-weight: 700;
      color: #18181b;
      flex-shrink: 0;
    }

    /* ---------- Paginação ---------- */

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .page-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: #E8761A;
      cursor: pointer;
    }

    .page-nav svg {
      width: 18px;
      height: 18px;
    }

    .page-nav:disabled {
      color: #d4d4d8;
      cursor: not-allowed;
    }

    .page-btn {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #3f3f46;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: #E8761A;
      border-color: #E8761A;
      color: #ffffff;
    }

    /* ---------- Menu mobile (topbar + drawer) ---------- */

    .mobile-topbar {
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 56px;
      background-color: #F1F1F1;
      padding: 0 16px;
    }

    .mobile-menu-toggle {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: #18181b;
      cursor: pointer;
    }

    .mobile-menu-toggle svg {
      width: 22px;
      height: 22px;
    }

    .mobile-logo {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #18181b;
      white-space: nowrap;
    }

    .mobile-logo .orange {
      color: #E8761A;
    }

    .mobile-logo-dots {
      position: relative;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .mobile-logo-dots .dot {
      position: absolute;
      border-radius: 50%;
    }

    .mobile-logo-dots .dot-teal { width: 5px; height: 5px; background-color: #35C6C1; top: 0; left: 5px; }
    .mobile-logo-dots .dot-pink { width: 5px; height: 5px; background-color: #E85AA0; top: 7px; left: 0; }
    .mobile-logo-dots .dot-orange { width: 5px; height: 5px; background-color: #E8761A; top: 8px; left: 13px; }
    .mobile-logo-dots .dot-blue { width: 4px; height: 4px; background-color: #4C6FE0; top: 14px; left: 7px; }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.45);
      z-index: 250;
    }

    .sidebar-backdrop.open {
      display: block;
    }

    .sidebar-close {
      display: none;
      position: absolute;
      top: 22px;
      right: 20px;
      background: none;
      border: none;
      color: #18181b;
      cursor: pointer;
      padding: 4px;
    }

    .sidebar-close svg {
      width: 20px;
      height: 20px;
    }

    /* ---------- Responsivo ---------- */

    @media (max-width: 768px) {
      .mobile-topbar {
        display: flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 85vw;
        max-width: 320px;
        height: 100vh;
        padding: 24px 20px;
        z-index: 300;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        overflow-y: auto;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-close {
        display: flex;
      }

      .topbar {
        display: none;
      }

      .main {
        padding: 24px 20px 40px;
      }

      .page-title {
        font-size: 20px;
      }

      .page-subtitle {
        font-size: 15px;
      }

      .list-controls-row {
        flex-wrap: wrap;
      }

      .search-input-wrap {
        width: 100%;
      }

      .filter-select-wrap {
        width: 100%;
      }

      .aluno-row {
        padding: 12px 14px;
      }

      .pagination {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

    <div class="mobile-logo">

              <div class="filter-option selected" data-value="ranking">Ranking</div>

  <script>
    const alunos = [
      { nome: 'Ana Beatriz Costa', email: 'ana.costa@email.com', nota: 98, respondidoEm: '2026-08-15T09:12:00' },
      { nome: 'Camila Ferreira', email: 'camila.ferreira@email.com', nota: 96, respondidoEm: '2026-08-19T16:40:00' },
      { nome: 'Diego Nascimento', email: 'diego.nascimento@email.com', nota: 94, respondidoEm: '2026-08-12T11:05:00' },
      { nome: 'Bernardo Soledade', email: 'bernardo.soledade@email.com', nota: 92, respondidoEm: '2026-08-20T08:30:00' },
      { nome: 'Rodrigo Almeida de Oliveira', email: 'rodrigo.oliveira@email.com', nota: 89, respondidoEm: '2026-08-10T14:22:00' },
      { nome: 'Leonardo Swiatovy', email: 'leonardo.swiatovy@email.com', nota: 86, respondidoEm: '2026-08-18T19:05:00' },
      { nome: 'Felipe Marques', email: 'felipe.marques@email.com', nota: 84, respondidoEm: '2026-08-09T10:00:00' },
      { nome: 'Luiz Fernando Quintas Teixeira', email: 'luiz.teixeira@email.com', nota: 81, respondidoEm: '2026-08-17T13:47:00' },
      { nome: 'Bruno Fortino Petroveski', email: 'bruno.petroveski@email.com', nota: 79, respondidoEm: '2026-08-07T17:15:00' },
      { nome: 'Marcos Jesus', email: 'marcos.jesus@email.com', nota: 77, respondidoEm: '2026-08-19T21:03:00' },
      { nome: 'Juliana Prado', email: 'juliana.prado@email.com', nota: 75, respondidoEm: '2026-08-05T08:50:00' },
      { nome: 'Vitor Hugo Ramos', email: 'vitor.ramos@email.com', nota: 72, respondidoEm: '2026-08-20T12:10:00' },
      { nome: 'Sofia Andrade', email: 'sofia.andrade@email.com', nota: 68, respondidoEm: '2026-08-03T15:35:00' },
      { nome: 'Gabriel Nogueira', email: 'gabriel.nogueira@email.com', nota: 65, respondidoEm: '2026-08-14T09:52:00' },
    ];

    const PAGE_SIZE = 10;
    let currentPage = 1;
    let sortMode = 'ranking';
    let filteredAlunos = alunos;

    function iniciais(nome) {
      const partes = nome.trim().split(/\s+/);
      const primeira = partes[0][0] || '';
      const ultima = partes.length > 1 ? partes[partes.length - 1][0] : '';
      return (primeira + ultima).toUpperCase();
    }

    const nomeSimulado = localStorage.getItem('statsSimuladoNome');
    if (nomeSimulado) {
      document.getElementById('page-subtitle').textContent =
        `Veja a lista de alunos que responderam "${nomeSimulado}".`;
    }

    const list = document.getElementById('aluno-list');
    const paginationEl = document.getElementById('pagination');

    function renderAlunos() {
      list.innerHTML = '';

      if (filteredAlunos.length === 0) {
        list.innerHTML = '<p style="color:#a1a1aa; font-size: 14.5px;">Nenhum aluno encontrado.</p>';
        return;
      }

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageAlunos = filteredAlunos.slice(start, start + PAGE_SIZE);

      pageAlunos.forEach((aluno) => {
        const row = document.createElement('button');
        row.className = 'aluno-row';
        row.innerHTML = `
          <span class="aluno-avatar">${iniciais(aluno.nome)}</span>
          <span class="aluno-info">
            <span class="aluno-name">${aluno.nome}</span><br>
            <span class="aluno-email">${aluno.email}</span>
          </span>
          <span class="aluno-score">${aluno.nota}%</span>
        `;
        row.addEventListener('click', () => {
          localStorage.setItem('relatorioAluno', JSON.stringify(aluno));
          window.location.href = 'relatorio-simulado-aluno.html';
        });
        list.appendChild(row);
      });
    }

    function renderPagination() {
      paginationEl.innerHTML = '';
      const totalPages = Math.ceil(filteredAlunos.length / PAGE_SIZE);
      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-nav';
      prevBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
      prevBtn.disabled = currentPage === 1;
      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderAlunos(); renderPagination(); }
      });
      paginationEl.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
        btn.textContent = i;
        btn.addEventListener('click', () => {
          currentPage = i;
          renderAlunos();
          renderPagination();
        });
        paginationEl.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-nav';
      nextBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages) { currentPage++; renderAlunos(); renderPagination(); }
      });
      paginationEl.appendChild(nextBtn);
    }

    function applySort(lista) {
      const ordenada = [...lista];
      if (sortMode === 'recentes') {
        ordenada.sort((a, b) => new Date(b.respondidoEm) - new Date(a.respondidoEm));
      } else {
        ordenada.sort((a, b) => b.nota - a.nota);
      }
      return ordenada;
    }

    function updateList() {
      const termo = document.getElementById('search-input').value.trim().toLowerCase();
      const filtrados = alunos.filter((aluno) =>
        aluno.nome.toLowerCase().includes(termo) || aluno.email.toLowerCase().includes(termo)
      );
      filteredAlunos = applySort(filtrados);
      currentPage = 1;
      renderAlunos();
      renderPagination();
    }

    document.getElementById('search-input').addEventListener('input', updateList);

    // Dropdown de ordenação
    const sortTrigger = document.getElementById('sort-trigger');
    const sortMenu = document.getElementById('sort-menu');
    const sortValue = document.getElementById('sort-value');

    sortTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      sortMenu.classList.toggle('open');
      sortTrigger.classList.toggle('open');
    });

    sortMenu.querySelectorAll('.filter-option').forEach((option) => {
      option.addEventListener('click', () => {
        sortMode = option.dataset.value;
        sortValue.textContent = option.textContent;
        sortMenu.querySelectorAll('.filter-option').forEach((o) => o.classList.remove('selected'));
        option.classList.add('selected');
        sortMenu.classList.remove('open');
        sortTrigger.classList.remove('open');
        updateList();
      });
    });

    document.addEventListener('click', () => {
      sortMenu.classList.remove('open');
      sortTrigger.classList.remove('open');
    });

    updateList();

    // Menu mobile
    const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
    const sidebarEl = document.querySelector('.sidebar');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    const sidebarClose = document.getElementById('sidebar-close');

    function openMobileMenu() {
      sidebarEl.classList.add('open');
      sidebarBackdrop.classList.add('open');
    }

    function closeMobileMenu() {
      sidebarEl.classList.remove('open');
      sidebarBackdrop.classList.remove('open');
    }

    mobileMenuToggle.addEventListener('click', openMobileMenu);
    sidebarClose.addEventListener('click', closeMobileMenu);
    sidebarBackdrop.addEventListener('click', closeMobileMenu);
  </script>

</body>
</html>
